# Build pull requests and deploy main using a GitHub Pages artifact.
# Set Settings → Pages → Build and deployment → Source to GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/lab-viewer/**"
      - "packages/core/**"
      - "data/**"
      - "yang/**"
      - "tools/sync-docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "apps/lab-viewer/**"
      - "packages/core/**"
      - "data/**"
      - "yang/**"
      - "tools/sync-docs.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build lab viewer
        env:
          VITE_BASE_PATH: /netlab.js/
        run: npm run build:pages
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
