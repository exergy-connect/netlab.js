# Build the library and run unit tests on every push and pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build minified action bundle
        run: npm run build:action

      - name: Check committed action bundle is current
        run: git diff --exit-code -- action-dist/

      - name: Upload action bundle
        uses: actions/upload-artifact@v4
        with:
          name: netlab-action-bundle
          path: |
            action-dist/normalize-topology.mjs
            action-dist/normalize-topology.mjs.LEGAL.txt
            yang/
          if-no-files-found: error

      - name: Build lab viewer
        run: npm run build:viewer

      - name: Unit tests
        run: npm test

      - name: Test topology comparison
        run: node --test tests/action/compare-topologies.test.mjs

      - name: Test topology action runner
        run: node --test tests/action/normalize.test.mjs

      - name: Test bundled action runner
        run: node --test tests/action/normalize.test.mjs
        env:
          NETLAB_ACTION_SCRIPT: action-dist/normalize-topology.mjs

      - name: Create action fixture
        run: |
          printf 'defaults.device: frr\nnodes: { r1: }\n' > "$RUNNER_TEMP/topology.yml"

      - name: Exercise composite action
        id: topology
        uses: ./
        with:
          input: ${{ runner.temp }}/topology.yml
          output: ${{ runner.temp }}/topology.json

      - name: Check action output
        env:
          TOPOLOGY_JSON: ${{ steps.topology.outputs.path }}
        run: node -e 'const fs = require("node:fs"); if (!JSON.parse(fs.readFileSync(process.env.TOPOLOGY_JSON)).topology.nodes.some(node => node.name === "r1")) process.exit(1)'
